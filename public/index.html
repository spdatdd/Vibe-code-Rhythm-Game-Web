<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ORBIT — Piano Tiles 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Màn hình Loading -->
  <section id="screen-loading" class="screen screen-loading" aria-label="Đang tải">
    <div class="loading-box">
      <div class="app-icon">◉</div>
      <h1>ORBIT</h1>
      <div class="loading-bar"><div id="loading-fill"></div></div>
      <p id="loading-status" role="status">Đang tải…</p>
    </div>
  </section>

  <!-- Menu chính kiểu mobile game iPhone -->
  <section id="screen-menu" class="screen screen-menu" hidden>
    <div class="menu-shell">
      <header class="menu-header">
        <div class="brand"><span class="brand-dot">◉</span><strong>ORBIT</strong></div>
      </header>

      <div class="menu-scroll">
        <!-- Chọn nguồn nhạc -->
        <section class="ios-card">
          <div id="local-panel">
            <label class="file-drop" for="local-file">
              <span class="file-icon">♫</span>
              <strong>Chọn bài hát</strong>
              <span>MP3, WAV, OGG, FLAC, M4A</span>
            </label>
            <input id="local-file" type="file" accept="audio/*" hidden>
            <div id="local-track-info" class="track-row" hidden>
              <strong id="local-title"></strong>
              <span id="local-meta"></span>
            </div>
          </div>
        </section>

        <!-- Độ khó, Tốc độ rơi & Bù trễ (Icon + Chữ) -->
        <section class="ios-card" id="settings-panel">
          <div class="row-head">
            <span class="menu-label"><i class="menu-ico ico-blue">⚡</i> Độ khó</span>
            <span id="note-count" class="chip">0 nốt</span>
          </div>
          <div class="tabs difficulty-tabs" role="group" aria-label="Độ khó">
            <button type="button" data-difficulty="normal" class="selected">Thường</button>
            <button type="button" data-difficulty="hard">Khó</button>
          </div>

          <div class="row-head offset-head">
            <label class="menu-label" for="scroll-speed"><i class="menu-ico ico-purple">⇣</i> Tốc độ rơi</label>
            <output id="speed-value" for="scroll-speed">1.0×</output>
          </div>
          <input id="scroll-speed" type="range" min="0.5" max="2.0" step="0.1" value="1.0">

          <div class="row-head offset-head">
            <label class="menu-label" for="audio-offset"><i class="menu-ico ico-green">🎧</i> Bù trễ</label>
            <output id="offset-value" for="audio-offset">0 ms</output>
          </div>
          <input id="audio-offset" type="range" min="-200" max="200" step="5" value="0">

          <button id="start" type="button" class="primary start-cta">▶ Chơi ngay</button>
          <p id="menu-status" class="status-line" role="status"></p>
        </section>
      </div>
    </div>
  </section>

  <!-- Màn hình chơi game Piano Tiles 3D -->
  <section id="screen-game" class="screen screen-game" hidden>
    <div class="timeline"><div id="progress"></div></div>

    <header class="game-hud">
      <div class="hud-track">
        <strong id="game-title">NEON DRIFT</strong>
        <small id="game-meta">THƯỜNG</small>
      </div>
      <div class="hud-stats">
        <div><small>ĐIỂM</small><strong id="score">000000</strong></div>
        <div><small>COMBO</small><strong id="combo"><b id="combo-value">0</b><span>×</span></strong></div>
        <div><small>CHUẨN</small><strong id="accuracy">—</strong></div>
      </div>
      <button id="pause" type="button" class="hud-pause" aria-label="Tạm dừng">⏸</button>
    </header>

    <div class="stage" tabindex="0" aria-label="Sân chơi Piano Tiles">
      <canvas id="arena-2d"></canvas>
      <canvas id="arena-3d" hidden></canvas>
      <div id="stage-hud" aria-hidden="true">
        <span id="countdown" hidden></span>
        <span id="judge-feedback" hidden></span>
      </div>
      <div class="stage-bottom">
        <span id="clock">00:00 / 00:48</span>
      </div>
    </div>

    <!-- Menu tạm dừng -->
    <div id="pause-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
      <div class="overlay-card">
        <h2 id="pause-title">Tạm dừng</h2>
        <p id="pause-subtitle">NEON DRIFT</p>
        <div class="overlay-actions">
          <button id="resume-btn" type="button" class="primary">▶ Tiếp tục</button>
          <button id="restart-btn" type="button">↻ Chơi lại</button>
          <button id="menu-btn" type="button">Menu chính</button>
        </div>
      </div>
    </div>

    <!-- Kết thúc lượt -->
    <div id="result-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden>
      <div class="overlay-card">
        <h2 id="result-title">Hoàn thành</h2>
        <div class="result-rank-row">
          <span id="result-rank" class="result-rank-badge">S</span>
          <span id="result-stars" class="result-stars">★★★</span>
          <span id="result-new-record" class="new-record-badge" hidden>Kỷ lục mới!</span>
        </div>
        <div class="result-stats">
          <div><small>ĐIỂM</small><strong id="result-score">0</strong></div>
          <div><small>COMBO</small><strong id="result-combo">0×</strong></div>
          <div><small>CHUẨN</small><strong id="result-accuracy">0%</strong></div>
        </div>
        <div class="result-judgements" aria-label="Chi tiết phán xét">
          <div class="judge-stat judge-perfect"><small>PERFECT</small><strong id="result-perfect">0</strong></div>
          <div class="judge-stat judge-great"><small>GREAT</small><strong id="result-great">0</strong></div>
          <div class="judge-stat judge-good"><small>GOOD</small><strong id="result-good">0</strong></div>
        </div>
        <div class="overlay-actions">
          <button id="result-restart-btn" type="button" class="primary">↻ Chơi lại</button>
          <button id="result-menu-btn" type="button">Menu chính</button>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
